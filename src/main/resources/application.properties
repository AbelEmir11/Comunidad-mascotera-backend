spring.application.name=backend
server.port=${PORT:8080}

# Configuracion de Base de Datos (H2 por defecto local, o PostgreSQL/Supabase en Produccion)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:comunidad_mascotera_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Habilitar consola web de H2 para desarrollo local
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configuracion de Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
