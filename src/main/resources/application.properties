spring.application.name=backend
server.port=8080

# Configuracion de Base de Datos H2 (En memoria y persistente en sesion)
spring.datasource.url=jdbc:h2:mem:comunidad_mascotera_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Habilitar consola web de H2 para visualizar tablas en /h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configuracion de Hibernate / JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
